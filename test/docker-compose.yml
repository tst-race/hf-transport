version: '3.8'

services:
  listener:
    image: ghcr.io/tst-race/raceboat/raceboat-runtime:latest
    container_name: hf-stego-listener
    command: >
      race-cli -m --server-connect --debug
      --logto /tmp/raceboat_server.log
      --param hfStegoTransportComposition.hf_username=testuser
      --param hfStegoTransportComposition.carrier_model=bert-base-uncased
      --recv-channel hfStegoTransportComposition
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_USERNAME=${HF_USERNAME}
    volumes:
      - ./kits:/server-kits:ro
      - ./server-logs:/tmp
    networks:
      - race-network

  dialer:
    image: ghcr.io/tst-race/raceboat/raceboat-runtime:latest
    container_name: hf-stego-dialer
    command: >
      race-cli -m --client-connect --debug
      --logto /tmp/raceboat_client.log
      --param hfStegoTransportComposition.hf_username=testuser
      --param hfStegoTransportComposition.carrier_model=bert-base-uncased
      --send-channel hfStegoTransportComposition
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_USERNAME=${HF_USERNAME}
    volumes:
      - ./kits:/client-kits:ro
      - ./client-logs:/tmp
    networks:
      - race-network
    depends_on:
      - listener

networks:
  race-network:
    driver: bridge